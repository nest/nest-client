name: Functional Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    services:
      nest-server:
        # image: nest/nest-simulator:3.11
        image: docker-registry.ebrains.eu/nest/nest-simulator:dev
        env:
          NEST_CONTAINER_MODE: nest-server
        ports:
          - 52425:52425
        options: >-
          --health-cmd "curl http://localhost:52425"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync

      - name: Run pytest with coverage
        run: |
          uv run coverage run --source=./src/nest_client -m pytest
          uv run coverage report
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  pytest:
    runs-on: ubuntu-latest
    needs: coverage
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    services:
      nest-server:
        # image: nest/nest-simulator:3.11
        image: docker-registry.ebrains.eu/nest/nest-simulator:dev
        env:
          NEST_CONTAINER_MODE: nest-server
        ports:
          - 52425:52425
        options: >-
          --health-cmd "curl http://localhost:52425"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync

      - name: Run pytest
        run: uv run pytest
