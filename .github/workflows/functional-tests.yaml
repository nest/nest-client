name: Functional tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup-uv:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Minimize uv cache
        run: uv cache prune --ci

  coverage:
    runs-on: ubuntu-latest
    needs: setup-uv
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    services:
      nest-server:
        # image: nest/nest-simulator:3.10
        image: docker-registry.ebrains.eu/nest/nest-simulator:dev
        env:
          NEST_CONTAINER_MODE: nest-server
        ports:
          - 52425:52425
        options: >-
          --health-cmd "curl http://localhost:52425"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run pytest with coverage
        run: make coverage

  pytest-all:
    runs-on: ubuntu-latest
    needs: setup-uv
    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    services:
      nest-server:
        # image: nest/nest-simulator:3.10
        image: docker-registry.ebrains.eu/nest/nest-simulator:dev
        env:
          NEST_CONTAINER_MODE: nest-server
        ports:
          - 52425:52425
        options: >-
          --health-cmd "curl http://localhost:52425"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install the project
        run: make sync

      - name: Run pytest for multiple Python versions
        run: make test-all
